<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balloon Pop - 第27弾</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #e1f5fe; font-family: sans-serif; touch-action: none; position: fixed; width: 100%; height: 100%; }
        
        /* 広告エリア：100pxに縮小 */
        #ad-top, #ad-bottom { position: fixed; left: 0; width: 100%; height: 100px; background: #333; z-index: 100; display: flex; align-items: center; justify-content: center; }
        #ad-top { top: 0; } #ad-bottom { bottom: 0; }
        iframe { border: none; width: 100%; height: 100px; }

        /* ゲームエリア */
        #game-outer { position: absolute; top: 100px; bottom: 100px; left: 0; right: 0; background: #e1f5fe; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: #0288d1; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 0 white; }

        /* メニュー画面：コンパクト＆スクロール対応 */
        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.96); display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; z-index: 50; 
            padding: 5px 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        #ad-middle-container { width: 300px; height: 120px; background: #000; margin: 5px 0; display: none; justify-content: center; align-items: center; overflow: hidden; flex-shrink: 0; }

        .btn-group { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 6px; padding-bottom: 20px; }
        #goButton { padding: 12px 0; font-size: 18px; background: #03a9f4; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; width: 200px; box-shadow: 0 4px #0288d1; }
        .link-btn { padding: 8px 0; font-size: 13px; background: #9b59b6; border: none; border-radius: 50px; color: white; font-weight: bold; text-decoration: none; width: 200px; text-align: center; box-shadow: 0 3px #8e44ad; }
    </style>
</head>
<body>

    <div id="ad-top"><iframe src="ad.html"></iframe></div>

    <div id="game-outer">
        <div id="ui">POPPED: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <h1 id="menuTitle" style="color:#03a9f4; margin: 2px 0; font-size: 24px;">Balloon Pop</h1>
            <p id="menuDesc" style="text-align: center; margin: 2px 0; font-size: 12px; color: #01579b;">
                赤い風船（🎈）だけを割ってね！<br>他を割るか、赤を逃すと終了！
            </p>
            
            <p id="bestScoreText" style="margin: 2px 0; color:#0288d1; font-weight: bold; font-size: 14px;">BEST: 0</p>

            <div id="ad-middle-container">
                <script src="https://adm.shinobi.jp/s/1e6de436ea850948e238e975a93767eb"></script>
            </div>

            <div class="btn-group">
                <button id="goButton">スタート！</button>
                <a href="https://saaaachi.github.io/" class="link-btn">他のゲームはこちら</a>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe src="ad.html"></iframe></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOuter = document.getElementById("game-outer");
        const menuScreen = document.getElementById("menuScreen");
        const adMid = document.getElementById("ad-middle-container");
        const goButton = document.getElementById("goButton");
        const bestText = document.getElementById("bestScoreText");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("pop_best") || 0, gameActive = false, balloons = [];
        const colors = ["#f44336", "#2196f3", "#ffeb3b", "#4caf50"]; // red, blue, yellow, green
        const targetColor = "#f44336";
        bestText.innerText = "BEST: " + bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none";
            gameActive = true;
            score = 0;
            balloons = [];
            document.getElementById("ui").innerText = "POPPED: 0";
            spawnBalloon();
            update();
        };

        // タッチ操作（判定を少し甘めに設定）
        window.addEventListener("touchstart", (e) => {
            if(!gameActive) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const tx = e.touches[0].clientX - rect.left;
            const ty = e.touches[0].clientY - rect.top;

            for(let i = balloons.length - 1; i >= 0; i--) {
                let b = balloons[i];
                let dist = Math.sqrt((tx - b.x) ** 2 + (ty - b.y) ** 2);
                if(dist < 45) { // 判定半径
                    if(b.color === targetColor) {
                        score++;
                        document.getElementById("ui").innerText = "POPPED: " + score;
                        balloons.splice(i, 1);
                    } else {
                        gameOver("それは赤じゃないよ！");
                    }
                    return;
                }
            }
        }, {passive: false});

        function spawnBalloon() {
            if(!gameActive) return;
            balloons.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: canvas.height + 50,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: 2 + Math.min(score / 15, 5),
                r: 30
            });
            setTimeout(spawnBalloon, Math.max(300, 700 - (score * 5)));
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(let i = balloons.length - 1; i >= 0; i--) {
                let b = balloons[i];
                b.y -= b.speed;

                // 風船の描画
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.ellipse(b.x, b.y, b.r * 0.8, b.r, 0, 0, Math.PI * 2);
                ctx.fill();
                // 紐
                ctx.strokeStyle = "#999";
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + b.r);
                ctx.lineTo(b.x, b.y + b.r + 15);
                ctx.stroke();

                if(b.y < -50) {
                    if(b.color === targetColor) {
                        gameOver("赤い風船を逃した！");
                    } else {
                        balloons.splice(i, 1);
                    }
                }
            }
            requestAnimationFrame(update);
        }

        function gameOver(msg) {
            gameActive = false;
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("pop_best", bestScore);
                bestText.innerText = "BEST: " + bestScore;
            }
            document.getElementById("menuTitle").innerText = "ミス！";
            document.getElementById("menuDesc").innerText = msg + "\n記録: " + score;
            goButton.innerText = "リトライ！";
            adMid.style.display = "flex"; 
            menuScreen.style.display = "flex";
            menuScreen.scrollTop = 0;
        }

        setInterval(() => {
            const fs = document.querySelectorAll('iframe');
            fs.forEach(f => {
                const s = f.src; f.src = "about:blank";
                setTimeout(() => f.src = s, 100);
            });
        }, 30000);
    </script>
</body>
</html>
